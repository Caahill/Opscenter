name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opshub
          POSTGRES_PASSWORD: opshub
          POSTGRES_DB: opshub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opshub"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://opshub:opshub@localhost:5432/opshub
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # Fresh random keys per run; CI never sees real ones.
      - run: node scripts/generate-keys.mjs --write
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Required check (TechSpec 11): a PR that fails the masking contract cannot merge.
      - run: pnpm test:masking
      - run: pnpm build

  e2e:
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opshub
          POSTGRES_PASSWORD: opshub
          POSTGRES_DB: opshub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opshub"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://opshub:opshub@localhost:5432/opshub
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node scripts/generate-keys.mjs --write
      - run: pnpm --filter @opshub/web exec playwright install --with-deps chromium
      # PRD acceptance criteria with click counts (TechSpec 11), on its own _e2e database.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
